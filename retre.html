<div class="paj-retre-kontni">
    <div class="retre-banner-box">
        <img src="https://i.postimg.cc/tTPghNYw/1772041853646-(1).png" alt="Echanj Plus" style="width: 100%; border-radius: 15px;">
    </div>

    <div class="user-status-bar-simple">
        <div class="status-info">
            <span class="label">Balans:</span>
            <span id="display-balance" class="value">0.00 HTG</span>
        </div>
        <div class="status-info">
            <span class="label">ID Kont:</span>
            <span id="display-ars-id" class="value">---</span> </div>
    </div>

    <div class="form-container">
        <div class="form-header">
            <h3>Demann Retrè</h3>
            <p>Done ou yo ap pase nan yon tinèl SSL chifre (Lojik 1)</p>
        </div>

        <div class="form-group">
            <label>Non sou kont reseptè a</label>
            <input type="text" id="retre-name" placeholder="Egz: Jean Bakèl">
        </div>

        <div class="form-group">
            <label>Nimewo telefòn</label>
            <input type="tel" id="retre-phone" placeholder="Egz: 47112233">
        </div>

        <div class="form-group">
            <label>Metòd peman</label>
            <select id="retre-method">
                <option value="MonCash">MonCash</option>
                <option value="NatCash">NatCash</option>
            </select>
        </div>

        <div class="form-group">
            <label>Montan (HTG)</label>
            <input type="number" id="retre-amount" placeholder="Minimòm 100 HTG">
        </div>

        <button class="btn-primary-pro" id="btn-konfime-retre">
            KONFIME RETRÈ
        </button>

        <div class="security-footer" style="text-align: center; margin-top: 15px; font-size: 11px; color: #999;">
            <i class="fa fa-shield-alt"></i> Tranzaksyon verifye pa Echanj Plus Security
        </div>
    </div>
        </div>
