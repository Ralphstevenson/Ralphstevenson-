<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echanj Plus | Ofisyèl 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="retre.css">
    <link rel="stylesheet" href="chat.css">
</head>
<body class="light-mode"> <div id="auth-page" class="auth-container">
        <div class="auth-card">
            <center>
                <img src="https://i.postimg.cc/vTtVtB8P/20260205-163353-removebg-preview.png" class="auth-logo" alt="Echanj Plus Logo">
            </center>

            <div id="login-section">
                <h2 class="auth-title">Konekte</h2>
                <div class="input-group">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="Email ou">
                </div>
                <div class="input-group">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="login-pass" placeholder="Modpas">
                </div>
                <button class="btn-primary-pro" onclick="handleLogin()">KONEKTE</button>
                <p class="auth-footer">Poko gen kont? <span onclick="toggleAuth('signup')">Enskri la</span></p>
            </div>

            <div id="signup-section" class="hidden">
                <h2 class="auth-title">Kreye Kont</h2>
                <div class="input-group"><i class="fa fa-user"></i><input type="text" id="sign-name" placeholder="Non Konplè"></div>
                <div class="input-group"><i class="fa fa-phone"></i><input type="tel" id="sign-phone" placeholder="Telefòn (MonCash/NatCash)"></div>
                <div class="input-group"><i class="fa fa-envelope"></i><input type="email" id="sign-email" placeholder="Email"></div>
                <div class="input-group"><i class="fa fa-lock"></i><input type="password" id="sign-pass" placeholder="Modpas (6+ karaktè)"></div>
                <button class="btn-primary-pro" onclick="handleSignup()">ANREJISTRE</button>
                <p class="auth-footer">Gen kont deja? <span onclick="toggleAuth('login')">Konekte</span></p>
            </div>
        </div>
    </div>

    <div id="home-page" class="hidden">
        
        <div id="sidebar" class="sidebar-pro">
            <div class="sidebar-header">
                <div class="user-meta">
                    <p id="side-id" class="user-id-badge">ARS-ID</p>
                    <h4 id="side-name">...</h4>
                    <p id="side-email">...</p>
                </div>
                <i class="fa fa-times close-sidebar" onclick="toggleSidebar()"></i>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item active" onclick="showPage('paj-akey', this)"><i class="fa fa-house"></i> Akèy</div>
                <div class="menu-item" onclick="showPage('paj-trans', this)"><i class="fa fa-clock-rotate-left"></i> Istorik</div>
                <div class="menu-item logout-btn" onclick="handleLogout()"><i class="fa fa-right-from-bracket"></i> Dekonekte</div>
            </div>
        </div>

        <header class="main-header">
            <i class="fa fa-bars-staggered" onclick="toggleSidebar()"></i>
            <div class="logo-text">ECHANJ PLUS</div>
            <i class="fa fa-bell" onclick="alert('Pa gen nouvo notifikasyon')"></i>
        </header>

        <main class="content-wrapper">
            
            <section id="paj-akey">
                <div class="carousel-container">
                    <div class="slides" id="carousel-slider">
                        <div class="slide"><img src="https://i.postimg.cc/DSHc5ZJV/1771501449871.png"></div>
                        <div class="slide"><img src="https://i.postimg.cc/s14wys8J/1771501465178.png"></div>
                        <div class="slide"><img src="https://i.postimg.cc/qNzL8n7K/1771501473121.png"></div>
                    </div>
                </div>

                <div class="card-balance-rect">
                    <p>Balans ou disponib</p>
                    <div class="balance-row">
                        <h1 id="user-balance">0.00</h1> <span>HTG</span>
                    </div>
                </div>

                <div class="action-card" onclick="showPage('paj-echanj', document.querySelector('.nav-item:nth-child(2)'))">
                    <div class="action-content"><i class="fa fa-rotate"></i> <b>Kòmanse yon echanj</b></div>
                    <i class="fa fa-chevron-right"></i>
                </div>
            </section>

            <section id="paj-echanj" class="hidden">
                <h3 class="page-title">Chwazi Rezo</h3>
                <div class="provider-card" onclick="openDialer('digicel')">
                    <div class="provider-info">
                        <img src="https://i.postimg.cc/zvH2mMwz/Digicel.jpg" width="45">
                        <b>Digicel (Minit > Cash)</b>
                    </div>
                    <i class="fa fa-phone-flip"></i>
                </div>
                <div class="provider-card" onclick="openDialer('natcom')">
                    <div class="provider-info">
                        <img src="https://i.postimg.cc/6q4bsSVK/natcom.webp" width="45">
                        <b>Natcom (Minit > Cash)</b>
                    </div>
                    <i class="fa fa-phone-flip"></i>
                </div>
            </section>

            <section id="paj-retre" class="hidden"></section>

            <section id="paj-trans" class="hidden">
                <h3 class="page-title">Istorik Tranzaksyon</h3>
                <div id="transaction-list" class="list-container">
                    </div>
            </section>

            <section id="chat-container" class="hidden"></section>

        </main>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="showPage('paj-akey', this)"><i class="fa fa-house"></i><span>Akèy</span></div>
            <div class="nav-item" onclick="showPage('paj-echanj', this)"><i class="fa fa-rotate"></i><span>Echanj</span></div>
            <div class="nav-item" onclick="showPage('paj-retre', this)"><i class="fa fa-money-bill-transfer"></i><span>Retrè</span></div>
            <div class="nav-item" onclick="showPage('paj-trans', this)"><i class="fa fa-clock-rotate-left"></i><span>Istorik</span></div>
            <div class="nav-item" onclick="showPage('chat-container', this)"><i class="fa fa-comments"></i><span>Sipò</span></div>
        </nav>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="retre.js"></script>
    <script type="module" src="chat.js"></script>

    <script>
        function toggleAuth(type) {
            document.getElementById('login-section').classList.toggle('hidden', type === 'signup');
            document.getElementById('signup-section').classList.toggle('hidden', type === 'login');
        }
    </script>
</body>
</html>
