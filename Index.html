<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echanj Plus | Ofisyèl 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="chat.js"></script>
    <link rel="stylesheet" href="retre.css">
    
    
</head>
<body>

    <div id="auth-page" class="auth-container">
        <div class="auth-card">
            <center>
                <img src="https://i.postimg.cc/vTtVtB8P/20260205-163353-removebg-preview.png" class="auth-logo" alt="Logo">
            </center>

            <div id="login-section">
                <h2 class="auth-title">Konekte</h2>
                <div class="input-group">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="Email ou">
                </div>
                <div class="input-group">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="login-pass" placeholder="Modpas">
                </div>
                
                <p class="reset-link" onclick="handleForgotPassword()">Mwen bliye modpas mwen</p>
                
               <br> <button class="btn-primary-pro" onclick="handleLogin()">KONEKTE</button> </br>
                <p class="auth-footer">Poko gen kont? <span onclick="toggleAuth('signup')">Enskri la</span></p>
            </div>

            <div id="signup-section" class="hidden">
                <h2 class="auth-title">Kreye Kont</h2>
                <div class="input-group"><i class="fa fa-user"></i><input type="text" id="sign-name" placeholder="Non Konplè"></div>
                <div class="input-group"><i class="fa fa-phone"></i><input type="tel" id="sign-phone" placeholder="Telefòn (MonCash/NatCash)"></div>
                <div class="input-group"><i class="fa fa-envelope"></i><input type="email" id="sign-email" placeholder="Email"></div>
                <div class="input-group"><i class="fa fa-lock"></i><input type="password" id="sign-pass" placeholder="Modpas (6+ karaktè)"></div>
                <div class="input-group"><i class="fa fa-gift"></i><input type="text" id="sign-ref" placeholder="Kòd Paren (Opsyonèl)"></div>
                
                <div class="terms-group">
    <input type="checkbox" id="accept-terms">
    <label for="accept-terms">Mwen asepte <span onclick="alert('Kondisyon Echanj Plus: Ou dakò pou pa fè fwod...') " style="color:var(--primary-blue); cursor:pointer; text-decoration:underline;">kondisyon yo</span></label>
                </div>
                

                <button class="btn-primary-pro" onclick="handleSignup()">ANSKRI</button>
                <p class="auth-footer">Gen kont deja? <span onclick="toggleAuth('login')">Konekte</span></p>
            </div>
        </div>
    </div>

    <div id="home-page" class="hidden">

        <div id="sidebar" class="sidebar-pro">
            <div class="sidebar-header">
                <div class="user-meta">
                    <p id="side-id" class="user-id-badge">ARS-ID</p>
                    <h4 id="side-name">Chaje non...</h4>
                    <p id="side-email">email@egzanp.com</p>
                </div>
                <i class="fa fa-times close-sidebar" onclick="toggleSidebar()"></i>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item active" onclick="showPage('paj-akey', this); toggleSidebar()"><i class="fa fa-house"></i> Akèy</div>
                <div class="menu-item" onclick="handleLogout()"><i class="fa fa-right-from-bracket"></i> Dekonekte</div>
            </div>
        </div>

        <header class="main-header">
            <i class="fa fa-bars-staggered" onclick="toggleSidebar()"></i>
            <div class="logo-text">ECHANJ PLUS</div>
            <i class="fa fa-bell"></i>
        </header>

        
<main class="content-wrapper">

            <section id="paj-akey"></section>
            <section id="paj-echanj" class="hidden"></section>
            <section id="paj-retre" class="hidden"></section>
            <section id="paj-trans" class="hidden"></section>
            <section id="chat-container" class="hidden"></section>
    
 </main>


        <nav class="bottom-nav">
            <div class="nav-item active" onclick="showPage('paj-akey', this)"><i class="fa fa-house"></i><span>Akèy</span></div>
            <div class="nav-item" onclick="showPage('paj-echanj', this)"><i class="fa fa-rotate"></i><span>Echanj</span></div>
            <div class="nav-item" onclick="showPage('paj-retre', this)"><i class="fa fa-money-bill-transfer"></i><span>Retrè</span></div>
            <div class="nav-item" onclick="showPage('paj-trans', this)"><i class="fa fa-clock-rotate-left"></i><span>Istorik</span></div>
            <div class="nav-item" onclick="showPage('chat-container', this)"><i class="fa fa-comments"></i><span>Sipò</span></div>
            </nav>     
    
    </div>
    
    <script src="ui-logic.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="retre.js"></script>

</body>
</html>
