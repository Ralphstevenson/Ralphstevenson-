<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echanj Plus | Ofisyèl 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="retre.css">
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="istorik.css">
</head>
<body class="light-mode">
    <div id="auth-page" class="auth-container">
        <div class="auth-card">
            <center><img src="https://i.postimg.cc/vTtVtB8P/20260205-163353-removebg-preview.png" class="auth-logo"></center>
            <div id="login-section">
                <h2 class="auth-title">Konekte</h2>
                <div class="input-group"><i class="fa fa-envelope"></i><input type="email" id="login-email" placeholder="Email ou"></div>
                <div class="input-group"><i class="fa fa-lock"></i><input type="password" id="login-pass" placeholder="Modpas"></div>
                <button class="btn-primary-pro" onclick="handleLogin()">KONEKTE</button>
                <p class="auth-footer">Poko gen kont? <span onclick="toggleAuth('signup')">Enskri la</span></p>
            </div>
            <div id="signup-section" class="hidden">
                <h2 class="auth-title">Kreye Kont</h2>
                <div class="input-group"><i class="fa fa-user"></i><input type="text" id="sign-name" placeholder="Non Konplè"></div>
                <div class="input-group"><i class="fa fa-phone"></i><input type="tel" id="sign-phone" placeholder="Telefòn"></div>
                <div class="input-group"><i class="fa fa-envelope"></i><input type="email" id="sign-email" placeholder="Email"></div>
                <div class="input-group"><i class="fa fa-lock"></i><input type="password" id="sign-pass" placeholder="Modpas"></div>
                <button class="btn-primary-pro" onclick="handleSignup()">ANREJISTRE</button>
                <p class="auth-footer">Gen kont deja? <span onclick="toggleAuth('login')">Konekte</span></p>
            </div>
        </div>
    </div>

    <div id="home-page" class="hidden">
        <div id="sidebar" class="sidebar-pro">
            <div class="sidebar-header">
                <div class="user-meta">
                    <p id="side-id" class="user-id-badge">ARS-ID</p>
                    <h4 id="side-name">...</h4>
                    <p id="side-email">...</p>
                </div>
                <i class="fa fa-times close-sidebar" onclick="toggleSidebar()"></i>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item active" onclick="showPage('paj-akey', this)"><i class="fa fa-house"></i> Akèy</div>
                <div class="menu-item" onclick="showPage('paj-trans', this)"><i class="fa fa-clock-rotate-left"></i> Istorik</div>
                <div class="menu-item logout-btn" onclick="handleLogout()"><i class="fa fa-right-from-bracket"></i> Dekonekte</div>
            </div>
        </div>

        <header class="main-header">
            <i class="fa fa-bars-staggered" onclick="toggleSidebar()"></i>
            <div class="logo-text">ECHANJ PLUS</div>
            <div class="notif-wrapper" onclick="toggleNotifPanel()">
                <i class="fa fa-bell"></i>
                <span id="notif-badge" class="notif-badge hidden">0</span>
            </div>
            <div id="notif-panel" class="notif-panel">
                <div class="notif-header"><h4>Notifikasyon</h4><i class="fa fa-times" onclick="toggleNotifPanel()"></i></div>
                <div class="notif-tabs">
                    <button id="tab-koneksyon" class="tab-btn active" onclick="switchNotifTab('koneksyon')">Koneksyon</button>
                    <button id="tab-transak" class="tab-btn" onclick="switchNotifTab('transak')">Tranzaksyon</button>
                </div>
                <div id="notif-content" class="notif-content"><p class="empty-msg">Chaje mesaj...</p></div>
            </div>
        </header>

        <main class="content-wrapper">
            <section id="paj-akey">
                <div class="carousel-container">
                    <div class="slides" id="carousel-slider">
                        <div class="slide"><img src="https://i.postimg.cc/DSHc5ZJV/1771501449871.png"></div>
                        <div class="slide"><img src="https://i.postimg.cc/s14wys8J/1771501465178.png"></div>
                        <div class="slide"><img src="https://i.postimg.cc/qNzL8n7K/1771501473121.png"></div>
                    </div>
                </div>
                <div class="card-balance-rect">
                    <p>Balans ou disponib</p>
                    <div class="balance-row"><h1 id="user-balance">0.00</h1> <span>HTG</span></div>
                </div>
                </section>

            <section id="paj-echanj" class="hidden">
                <h3 class="page-title">Echanj Minit</h3>
                <div class="kalkilatris-box">
                    <input type="number" id="input-montan" placeholder="0.00" oninput="kalkileEchanj()">
                    <div class="rezilta-calc"><b id="res-net">0.00 HTG</b></div>
                </div>
                <div class="provider-card" onclick="openDialer('digicel')"><b>Digicel</b></div>
                <div class="provider-card" onclick="openDialer('natcom')"><b>Natcom</b></div>
            </section>

            <section id="paj-retre" class="hidden"></section>

            <section id="paj-trans" class="hidden">
                <h3 class="page-title">Istorik Tranzaksyon</h3>
                <div id="transaction-list" class="list-container"></div>
            </section>

            <section id="chat-container" class="hidden"></section>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="showPage('paj-akey', this)"><i class="fa fa-house"></i><span>Akèy</span></div>
            <div class="nav-item" onclick="showPage('paj-echanj', this)"><i class="fa fa-rotate"></i><span>Echanj</span></div>
            <div class="nav-item" onclick="showPage('paj-retre', this)"><i class="fa fa-money-bill-transfer"></i><span>Retrè</span></div>
            <div class="nav-item" onclick="showPage('paj-trans', this)"><i class="fa fa-clock-rotate-left"></i><span>Istorik</span></div>
            <div class="nav-item" onclick="showPage('chat-container', this)"><i class="fa fa-comments"></i><span>Sipò</span></div>
        </nav>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="retre.js"></script>
    <script type="module" src="chat.js"></script>
    <script type="module" src="istorik.js"></script>
</body>
                                             </html>
