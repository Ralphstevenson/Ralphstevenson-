<div class="chat-wrapper">
    <div class="chat-header">
        <div id="presence-indicator" class="status-dot offline"></div>
        <div class="admin-info">
            <p style="margin:0; font-weight:bold; font-size:14px;">Sipò Echanj Plus</p>
            <small id="admin-status-text" style="font-size:11px; opacity:0.8;">De-konekte</small>
        </div>
    </div>

    <div id="chat-messages" class="chat-body">
        <div style="text-align:center; padding:20px; color:#999; font-size:12px;">
            <i class="fa-solid fa-lock" style="margin-bottom:5px;"></i>
            <p>Konvèsasyon sa a an sekirite.</p>
        </div>
    </div>

    <div class="chat-footer">
        <label for="chat-file" style="cursor:pointer; color:#0052cc; font-size:18px;">
            <i class="fa-solid fa-camera"></i>
            <input type="file" id="chat-file" accept="image/*" style="display:none">
        </label>
        
        <input type="text" id="chat-input" placeholder="Ekri yon mesaj..." autocomplete="off">
        
        <button id="btn-send-chat" style="background:none; border:none; color:#0052cc; font-size:18px; cursor:pointer;">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>
<audio id="chat-notif" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>
