<div class="chat-wrapper">
    
    <div class="chat-header">
        <div class="header-left">
            <div class="profile-avatar-main">
                <img src="https://i.postimg.cc/zBs03Y9d/file-00000000171471f5a0ff5138fae23eb4.png" alt="Admin" class="header-logo">
                <div id="presence-indicator" class="status-dot offline"></div>
            </div>
            <div class="admin-info">
                <p class="admin-name">Sipò Echanj Plus</p>
                <small id="admin-status-text" class="status-label">De-konekte</small>
            </div>
        </div>
        <div class="header-right">
            <i class="fa-solid fa-ellipsis-vertical" style="cursor:pointer; opacity:0.8;"></i>
        </div>
    </div>

    <div id="chat-messages" class="chat-body">
        <div class="secure-notice">
            <i class="fa-solid fa-lock" style="margin-bottom:5px; display:block;"></i>
            <p>Konvèsasyon sa a an sekirite epi li chiffres.</p>
        </div>

        </div>

    <div class="chat-footer">
        <label for="chat-file" class="footer-icon">
            <i class="fa-solid fa-camera"></i>
            <input type="file" id="chat-file" accept="image/*" style="display:none">
        </label>
        
        <div class="input-container">
            <input type="text" id="chat-input" placeholder="Ekri yon mesaj..." autocomplete="off">
        </div>
        
        <button id="btn-send-chat" class="send-btn" style="background:none; border:none; color:#0052cc; font-size:18px; cursor:pointer;">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

</div>

<audio id="chat-notif" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>
